[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geochip"
version = "3.0.1"
description = "GeoChip CLI: Interactive geospatial pipeline for multi-satellite imagery ingestion, raster chipping, and Roboflow annotation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "GeoChip CLI Contributors" },
]
keywords = ["geospatial", "earth-engine", "sentinel-2", "landsat", "roboflow", "remote-sensing", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "earthengine-api>=1.0.0",
    "pyshp>=2.3.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "roboflow>=1.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Anovvy/GeoChip-CLI"
Repository = "https://github.com/Anovvy/GeoChip-CLI"
Issues = "https://github.com/Anovvy/GeoChip-CLI/issues"

[project.scripts]
GeoChip = "geochip.cli:main"
geochip = "geochip.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geochip*"]
exclude = ["data*", "tests*", "docs*", "scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
