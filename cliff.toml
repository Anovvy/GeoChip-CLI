[changelog]
header = """
# Changelog\n
All notable changes to GeoChip CLI are documented in this file.\n
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and [Semantic Versioning](https://semver.org/).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% set breaking_commits = commits | filter(attribute="breaking", value=true) -%}
{% if breaking_commits | length > 0 %}
    ### Breaking Changes
    {% for commit in breaking_commits %}
        - {% if commit.breaking_description %}{{ commit.breaking_description | trim }}{% else %}{{ commit.message | split(pat="\n") | first | trim }}{% endif %} ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI/CD" },
  { message = "^style", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(build|chore)\\(deps", group = "Dependencies" },
  { message = "^chore", group = "Chores" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"
